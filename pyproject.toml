[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-model-gate"
version = "0.1.0"
description = "Evidence-based model displacement decisions for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Othmane Achir"}]
keywords = ["ai-agents", "coding-agents", "llm", "finops", "model-routing", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
agent-model-gate = "agent_model_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
